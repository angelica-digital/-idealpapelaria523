<!-- =====================================================
     HEADER
====================================================== -->

<header
  class="relative z-40 bg-white border-b border-slate-100"
>

  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"
  >

    <div
      class="h-[72px] flex items-center justify-between gap-3"
    >

      <!-- LOGO -->

      <a
        href="#inicio"
        class="flex items-center gap-3 shrink-0"
      >

        <div
          class="w-11 h-11 rounded-xl brand-gradient text-white flex items-center justify-center shadow-md"
        >
          <i class="fa-solid fa-pencil text-lg"></i>
        </div>

        <div class="leading-none">

          <span
            class="block text-xl sm:text-2xl font-black tracking-tight text-slate-950"
          >
            Ideal
          </span>

          <span
            class="text-[9px] sm:text-xs font-extrabold uppercase tracking-[.14em] brand-text"
          >
            Papelaria & Cia
          </span>

        </div>

      </a>


      <!-- MENU DESKTOP -->

      <nav
        class="hidden lg:flex items-center gap-7 text-sm font-semibold text-slate-600"
      >

        <a
          href="#categorias"
          class="hover:text-ideal-orange transition"
        >
          Produtos
        </a>

        <a
          href="#servicos"
          class="hover:text-ideal-orange transition"
        >
          Serviços
        </a>

        <a
          href="#avaliacoes"
          class="hover:text-ideal-orange transition"
        >
          Avaliações
        </a>

        <a
          href="#instagram"
          class="hover:text-ideal-pink transition"
        >
          Instagram
        </a>

        <a
          href="#contato"
          class="hover:text-ideal-orange transition"
        >
          Onde estamos
        </a>

      </nav>


      <!-- AÇÕES -->

      <div class="flex items-center gap-2">

        <!-- WHATSAPP -->

        <a
          data-whatsapp
          href="#"
          class="inline-flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold rounded-xl px-3 sm:px-5 py-3 transition shadow-md active:scale-[.98]"
        >

          <i class="fa-brands fa-whatsapp text-xl"></i>

          <span class="hidden sm:inline">
            Chamar no WhatsApp
          </span>

          <span class="sm:hidden text-sm">
            WhatsApp
          </span>

        </a>


        <!-- BOTÃO MENU MOBILE -->

        <button
          id="mobileMenuButton"
          type="button"
          aria-label="Abrir menu"
          aria-expanded="false"
          class="lg:hidden w-11 h-11 rounded-xl border border-slate-200 bg-white text-slate-800 flex items-center justify-center transition hover:bg-slate-50 active:scale-95"
        >

          <i
            id="mobileMenuIcon"
            class="fa-solid fa-bars text-lg"
          ></i>

        </button>

      </div>

    </div>


    <!-- =================================================
         MENU MOBILE
    ================================================== -->

    <div
      id="mobileMenu"
      class="hidden lg:hidden pb-4"
    >

      <nav
        class="bg-white border border-slate-100 shadow-soft rounded-2xl p-2"
      >

        <a
          href="#categorias"
          class="mobile-menu-link flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-ideal-orange transition"
        >

          <span
            class="w-9 h-9 rounded-lg bg-orange-50 text-ideal-orange flex items-center justify-center"
          >
            <i class="fa-solid fa-bag-shopping"></i>
          </span>

          Produtos

          <i
            class="fa-solid fa-chevron-right text-xs text-slate-300 ml-auto"
          ></i>

        </a>


        <a
          href="#servicos"
          class="mobile-menu-link flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-orange-50 hover:text-ideal-orange transition"
        >

          <span
            class="w-9 h-9 rounded-lg bg-orange-50 text-ideal-orange flex items-center justify-center"
          >
            <i class="fa-solid fa-print"></i>
          </span>

          Serviços

          <i
            class="fa-solid fa-chevron-right text-xs text-slate-300 ml-auto"
          ></i>

        </a>


        <a
          href="#avaliacoes"
          class="mobile-menu-link flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-yellow-50 transition"
        >

          <span
            class="w-9 h-9 rounded-lg bg-yellow-50 text-yellow-500 flex items-center justify-center"
          >
            <i class="fa-solid fa-star"></i>
          </span>

          Avaliações

          <i
            class="fa-solid fa-chevron-right text-xs text-slate-300 ml-auto"
          ></i>

        </a>


        <a
          href="#instagram"
          class="mobile-menu-link flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-pink-50 hover:text-ideal-pink transition"
        >

          <span
            class="w-9 h-9 rounded-lg bg-pink-50 text-ideal-pink flex items-center justify-center"
          >
            <i class="fa-brands fa-instagram"></i>
          </span>

          Instagram

          <i
            class="fa-solid fa-chevron-right text-xs text-slate-300 ml-auto"
          ></i>

        </a>


        <a
          href="#contato"
          class="mobile-menu-link flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold text-slate-700 hover:bg-blue-50 transition"
        >

          <span
            class="w-9 h-9 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center"
          >
            <i class="fa-solid fa-location-dot"></i>
          </span>

          Onde estamos

          <i
            class="fa-solid fa-chevron-right text-xs text-slate-300 ml-auto"
          ></i>

        </a>

      </nav>

    </div>

  </div>

</header>
